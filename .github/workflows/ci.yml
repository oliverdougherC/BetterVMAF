name: macOS CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      intel_runner:
        description: Supplemental native Intel validation on the standard public runner
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (macOS 15, Xcode 16.4)
    runs-on: ${{ inputs.intel_runner && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Report toolchain
        run: |
          xcodebuild -version
          sw_vers
          uname -m

      - name: Check project and packaging syntax
        run: |
          plutil -lint VMAF.xcodeproj/project.pbxproj
          plutil -lint Config/Updater.plist VMAF/VMAF.entitlements
          for script in create_dmg.sh scripts/release/*.sh; do bash -n "$script"; done
          xcodebuild -list -project VMAF.xcodeproj

      - name: Lint GitHub Actions workflows
        run: scripts/release/lint-workflows.sh

      - name: Test release metadata and feed validation
        run: python3 -B -m unittest discover -s scripts/release -p 'test_*.py'

      - name: Build Release without signing credentials
        run: |
          xcodebuild \
            -project VMAF.xcodeproj \
            -scheme VMAF \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            -onlyUsePackageVersionsFromResolvedFile \
            'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Guard the macOS 28 Rosetta fix and verify the pinned engine beyond
      # architecture: exact SHA-256 from docs/ENGINE_PROVENANCE.md, Developer ID
      # signature, libvmaf capability, and a real encoded fixture analyzed with the
      # helper *from the built .app* on every supported slice. See that doc for
      # provenance and parity evidence.
      - name: Verify bundled FFmpeg engine
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release/Better VMAF.app"
          scripts/release/verify-app.sh "$PWD/$APP"

      - name: Run unit and UI tests
        run: |
          xcodebuild \
            -project VMAF.xcodeproj \
            -scheme VMAF \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            -onlyUsePackageVersionsFromResolvedFile \
            -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: macOS-test-results
          path: build/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14
