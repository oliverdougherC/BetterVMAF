name: Package a release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mode:
        description: Unsigned package or genuine production preflight (no tag/draft/feed)
        type: choice
        options: [unsigned, production-preflight]
        default: unsigned

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch-policy:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'production-preflight' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo '::error::Production preflight must run from reviewed main. No signing or publication was attempted.'
          exit 1

  dispatch-policy:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'production-preflight' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo 'Production preflight must run from reviewed main; no signing credentials were accessed.' >&2
          exit 1

  validate:
    if: github.event_name == 'push' && github.repository == 'oliverdougherC/BetterVMAF'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the tag, ancestry, and release order
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 scripts/release/release.py check-new-tag "$GITHUB_REF_NAME" "$RUNNER_TEMP/releases.json"

  credentials:
    needs: validate
    if: >-
      always() && ((github.event_name == 'push' && needs.validate.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'production-preflight' && github.ref == 'refs/heads/main'))
    environment: release-signing
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Fail before CI when signing settings are missing
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          source scripts/release/check-signing-inputs.sh
          check_signing_inputs

  ci:
    needs: [validate, credentials]
    if: >-
      always() && ((github.event_name == 'workflow_dispatch' && inputs.mode != 'production-preflight') ||
      needs.credentials.result == 'success')
    uses: ./.github/workflows/ci.yml

  dry-run:
    if: always() && needs.ci.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.mode != 'production-preflight'
    needs: ci
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: ./create_dmg.sh "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: unsigned-dry-run
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
          retention-days: 7

  sign:
    if: >-
      always() && needs.ci.result == 'success' &&
      ((github.event_name == 'push' && needs.validate.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'production-preflight' && github.ref == 'refs/heads/main'))
    needs: [validate, ci]
    environment: release-signing
    runs-on: macos-15
    timeout-minutes: 80
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Sign and verify the release package
        env:
          REQUIRE_BOTH_ENGINE_SLICES: '1'
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag="v$(python3 scripts/release/release.py version)"
          fi
          scripts/release/package.sh production "$RUNNER_TEMP/package" "$tag"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: signed-release
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
          retention-days: 3

  draft:
    if: github.event_name == 'push'
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release
          path: package
      - name: Create a draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          version=$(python3 scripts/release/release.py check-new-tag "$GITHUB_REF_NAME" "$RUNNER_TEMP/releases.json")
          dmg=$(python3 scripts/release/release.py asset-name "$version")
          python3 scripts/release/release.py verify-checksum "package/$dmg"
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --latest=false \
            --title "Better VMAF $version" --generate-notes \
            "package/$dmg" "package/$dmg.sha256" package/appcast.xml

  staging:
    if: always() && needs.dry-run.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.mode != 'production-preflight'
    needs: dry-run
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      REQUIRE_BOTH_ENGINE_SLICES: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: scripts/release/staging-smoke.sh "$RUNNER_TEMP/staging"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: staging-integration
          path: ${{ runner.temp }}/staging/
          if-no-files-found: error
          retention-days: 3

  verify-staging-transfer:
    if: always() && needs.staging.result == 'success'
    needs: staging
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      REQUIRE_BOTH_ENGINE_SLICES: '1'
      SPARKLE_FEED_URL: http://localhost:18742/appcast.xml
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staging-integration
          path: staging
      - name: Independently verify transferred DMGs and signed feed
        run: |
          export SPARKLE_PUBLIC_KEY
          SPARKLE_PUBLIC_KEY=$(cat staging/staging-public-key.txt)
          scripts/release/verify-dmg.sh "$PWD/staging/old/Better-VMAF-1.4.0.dmg" 1.4.0 staging
          scripts/release/verify-dmg.sh "$PWD/staging/new/Better-VMAF-1.4.1.dmg" 1.4.1 staging
          python3 scripts/release/staging-negative-tests.py staging/new
